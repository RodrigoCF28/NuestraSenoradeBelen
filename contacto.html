<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Parroquia Nuestra Señora de Belén</title>
    <style>
        :root {
            --cafe-oscuro: #5c4033;
            --cafe-principal: #8b5a2b;
            --cafe-claro: #d7c4b7;
            --rosa-suave: #f7ebe8;
            --rosa-acento: #e8b4b8;
            --texto-oscuro: #3d2b1f;
            --blanco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Georgia, serif; }
        body { background-color: var(--rosa-suave); color: var(--texto-oscuro); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }

        header { background-color: var(--cafe-oscuro); color: var(--blanco); padding: 1rem 2rem; position: sticky; top: 0; z-index: 1000; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; }
        .logo { font-size: 1.4rem; font-weight: bold; color: var(--rosa-acento); }
        .nav-links { display: flex; list-style: none; gap: 1.5rem; }
        .nav-links a:hover { color: var(--rosa-acento); }

        .container { max-width: 700px; margin: 3rem auto; padding: 0 1.5rem; }
        .section-title { text-align: center; color: var(--cafe-oscuro); margin-bottom: 2.5rem; font-size: 2.2rem; }
        .section-title::after { content: ''; display: block; width: 60px; height: 3px; background-color: var(--rosa-acento); margin: 0.5rem auto 0; }

        .contact-box { background: var(--blanco); padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: var(--cafe-oscuro); }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--cafe-claro); border-radius: 6px; font-size: 1rem; }
        .form-group textarea { height: 120px; resize: vertical; }

        .btn-submit { background-color: var(--cafe-principal); color: var(--blanco); border: none; padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.3s; }
        .btn-submit:hover { background-color: var(--cafe-oscuro); }

        footer { background-color: var(--cafe-oscuro); color: var(--blanco); text-align: center; padding: 2rem; margin-top: 4rem; }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Nuestra Señora de Belén</div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="patrona.html">Nuestra Patrona</a></li>
                <li><a href="horarios.html">Horarios</a></li>
                <li><a href="eventos.html">Eventos</a></li>
                <li><a href="contacto.html" style="color: var(--rosa-acento);">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Contác­ta­nos</h1>

        <div class="contact-box">
            <form action="https://formspree.io/f/tu-codigo-aqui" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje o Intención de Misa</label>
                    <textarea id="mensaje" name="mensaje" required placeholder="Escribe tu consulta o intenciones..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Parroquia Nuestra Señora de Belén</p>
    </footer>

</body>
</html>
